name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：本 CI 仅 checkout + build + test，无任何写副作用（不推 commit/tag、不发 release、
# 不评论 PR、不推镜像、不上传 SARIF、无 OIDC 云登录）。跨仓 checkout platform 用独立
# CROSS_REPO_TOKEN 而非默认 GITHUB_TOKEN，故 GITHUB_TOKEN 只需 contents: read 读取代码。
permissions:
  contents: read

# 同一 ref 上新 push 到来时取消尚在跑的过时 CI（PR 连续 push 常见）——省算力/排队。
# 该仓 CI 无发布/部署副作用（release 是独立 workflow），故可直接 cancel 过时 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 防漂移 gate（ADR 0023 阶段6）：本仓版本须符合 release-plan.json 单一事实源
      # （脚本+plan 在 platform 仓，单点维护）。本仓无 platform 依赖，故为 gate 单独
      # checkout platform。PR 时即拦截漂移。
      - uses: actions/checkout@v6
        with:
          repository: aster-cloud/aster-lang-platform
          path: aster-lang-platform
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Release-plan drift gate
        run: |
          python3 aster-lang-platform/scripts/release-plan/check-artifact.py \
            --plan aster-lang-platform/release-plan.json \
            --artifact runtime:maven --repo-root .

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # catalog bootstrap（ADR 0023 §9）：本仓 version=catalog-derived（findVersion asterLang），
      # settings 从 mavenLocal 解析 catalog → 须先把已 checkout 的 platform publishToMavenLocal，
      # 否则 ./gradlew 配置期解析不到 asterLibs catalog。
      - name: Bootstrap version catalog to Maven Local
        run: cd aster-lang-platform && ./gradlew publishToMavenLocal

      - name: Build & Test
        run: ./gradlew build
